*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,sans-serif;font-weight:400}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{min-height:100%;padding-bottom:96px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .logo{height:34px;cursor:pointer}
.top .sp{flex:1}
.top .crumb{font-size:15px;color:var(--gray);font-weight:300}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.iconbtn svg{width:22px;height:22px;stroke:var(--navy)}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:6px;padding:7px;background:var(--navy);border-radius:24px;box-shadow:0 14px 40px rgba(11,30,74,.28)}
.nav button{display:flex;align-items:center;gap:9px;padding:12px 20px;border-radius:18px;color:#B9C6E4;font-size:15px;font-weight:500;white-space:nowrap}
.nav button svg{width:20px;height:20px;stroke:currentColor}
.nav button.on{background:#fff;color:var(--navy)}

/* ---------- vision wordmark ---------- */
.vm{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1}
.vm .pre{align-self:flex-start;font-size:.13em;letter-spacing:.06em;font-weight:400;margin-bottom:.06em;text-transform:uppercase}
.vm .word{width:3.27em;height:1em;background:currentColor;-webkit-mask:var(--vision) center/contain no-repeat;mask:var(--vision) center/contain no-repeat}
.vm .sub{font-size:.3em;font-weight:300;margin-top:.08em;letter-spacing:.01em}

/* ---------- home ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.hero{margin:26px 0 8px;border-radius:30px;padding:44px 48px;background:linear-gradient(120deg,#0C3982 0%,#004FCE 55%,#423FE4 100%);color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:44px;font-weight:600;margin:0 0 10px;letter-spacing:-.02em;line-height:1.08}
.hero p{font-size:19px;font-weight:300;max-width:620px;margin:0;opacity:.92;line-height:1.5}
.hero .stats{display:flex;gap:34px;margin-top:30px;flex-wrap:wrap}
.hero .stat b{display:block;font-size:30px;font-weight:600}
.hero .stat span{font-size:14px;opacity:.8;font-weight:300}
.hero .ring{position:absolute;right:-90px;top:-90px;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.07)}
.hero .ring.b{right:120px;top:180px;width:220px;height:220px;border-width:30px}
.filters{display:flex;gap:10px;margin:26px 0 18px;flex-wrap:wrap}
.chip{padding:11px 20px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:15px;color:var(--gray)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.group-t{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin:26px 0 12px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:26px 26px 22px;text-align:left;position:relative;overflow:hidden;transition:transform .15s}
.card:active{transform:scale(.98)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.card .vm{font-size:58px;color:var(--c)}
.card .tier{display:inline-block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);margin-bottom:16px}
.card p{margin:16px 0 0;color:var(--gray);font-size:15px;line-height:1.5;font-weight:300}
.card .go{position:absolute;right:20px;bottom:18px;width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center}
.card .go svg{width:18px;stroke:#fff}
.card .mini{margin-top:18px;height:120px;border-radius:14px;background:var(--bg);display:flex;align-items:center;padding:12px 70px 12px 18px;gap:14px}
.card .mini svg{height:96px;width:auto;flex:none}
.card .mini span{font-size:12.5px;color:var(--gray);font-weight:300;line-height:1.45}

/* ---------- lens page ---------- */
.lhero{background:var(--c);color:#fff;position:relative;overflow:hidden}
.lhero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.18),transparent 45%),linear-gradient(180deg,transparent 60%,rgba(0,0,0,.12))}
.lhero .in{position:relative;z-index:1;display:flex;align-items:center;gap:40px;padding:24px 28px 24px;max-width:1280px;margin:0 auto;flex-wrap:wrap}
.lhero .vm{font-size:84px}
.lhero .txt{flex:1;min-width:300px}
.lhero .tier{display:inline-block;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.18);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:12px}
.lhero h2{font-size:25px;font-weight:500;margin:0 0 8px;line-height:1.25}
.lhero p{margin:0;font-weight:300;font-size:16px;line-height:1.5;opacity:.92;max-width:640px}
.lhero .arrows{display:flex;gap:10px}
.lhero .arrows button{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.lhero .arrows svg{width:22px;stroke:#fff}
.tabs{position:sticky;top:63px;z-index:15;background:var(--bg);padding:16px 0 10px}
.tabs .in{display:flex;gap:8px;max-width:1280px;margin:0 auto;padding:0 28px;overflow-x:auto}
.tab{padding:12px 22px;border-radius:14px;font-size:16px;font-weight:500;color:var(--gray);background:#fff;border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}
.panel{max-width:1280px;margin:0 auto;padding:14px 28px 30px}

/* field of view */
.fov{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
.box{background:#fff;border-radius:var(--r);border:1px solid var(--line);padding:24px}
.box h3{margin:0 0 4px;font-size:20px;font-weight:600}
.box .sub{color:var(--gray);font-size:14px;font-weight:300;margin:0 0 16px}
.simwrap{position:relative}
.sim svg{width:100%;height:auto;max-height:min(46vh,440px);display:block;margin:0 auto}
.map svg{max-height:min(34vh,330px)}
.toggle{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin-bottom:16px}
.toggle button{white-space:nowrap;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:var(--gray)}
.toggle button.on{background:#fff;color:var(--c);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--gray)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.note{font-size:12px;color:#97A1B6;margin-top:10px;font-weight:300}
.side2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side2 .lbl{font-size:14px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.side2 .lbl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.map svg{width:100%;height:auto;display:block}
.zones{margin-top:16px;display:grid;gap:10px}
.zone{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg)}
.zone .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.zone .ic svg{width:22px;stroke:var(--c)}
.zone b{display:block;font-size:15px;font-weight:600}
.zone span{font-size:13px;color:var(--gray);font-weight:300}
.zone .pct{margin-left:auto;font-weight:600;color:var(--c);font-size:15px;white-space:nowrap}

/* features */
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media (max-width:980px){.feats{grid-template-columns:1fr 1fr}}
.feat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px}
.feat .ic{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,#fff);display:grid;place-items:center;margin-bottom:14px}
.feat .ic svg{width:24px;stroke:var(--c)}
.feat b{display:block;font-size:17px;font-weight:600;margin-bottom:6px}
.feat span{color:var(--gray);font-size:14.5px;line-height:1.5;font-weight:300}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.bars .row{margin:0 0 16px}
.bars .row .t{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:7px}
.bars .row .t em{font-style:normal;color:var(--gray);font-weight:300}
.track{height:14px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#E8412C,#F6D21C 45%,#7FD3E0);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:9px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.tag.c{background:color-mix(in srgb,var(--c) 10%,#fff);border-color:color-mix(in srgb,var(--c) 30%,#fff);color:var(--c);font-weight:500}
.spec{width:100%;border-collapse:collapse;font-size:14.5px}
.spec td{padding:11px 0;border-bottom:1px solid var(--line)}
.spec td:first-child{color:var(--gray);font-weight:300;width:42%}

/* comparison table */
.ctab{width:100%;border-collapse:separate;border-spacing:0 8px}
.ctab th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);text-align:left;font-weight:500;padding:0 16px}
.ctab td{background:#fff;padding:16px;font-size:15.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ctab td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;color:var(--gray);font-weight:500;font-size:14px;width:22%}
.ctab td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.ctab tr.us td{background:var(--c);color:#fff;border-color:var(--c)}
.ctab tr.us td:first-child{color:rgba(255,255,255,.8)}
.badge{display:inline-block;font-size:11px;padding:4px 9px;border-radius:99px;background:#FFF4D6;color:#8A6200;font-weight:500;letter-spacing:.04em;margin-left:8px;vertical-align:2px}
.cmpcols{display:grid;gap:16px}
.cmphead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}

/* market page */
.mk{overflow-x:auto;border-radius:var(--r)}
.mk table{border-collapse:separate;border-spacing:6px;min-width:980px;width:100%}
.mk th{background:#3D6FB8;color:#fff;padding:14px 10px;border-radius:12px;font-size:13px;letter-spacing:.06em}
.mk th.us{background:var(--navy)}
.mk td{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;font-size:14.5px;height:64px}
.mk td.lvl{font-weight:600;font-size:13px;letter-spacing:.06em;color:#fff;border:0}
.mk td.us{background:var(--navy);color:#fff;font-weight:600;cursor:pointer;border:0}
.mk tr.hl td:not(.lvl){outline:3px solid #F6D21C;outline-offset:-3px}

/* compare page */
.pick{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 18px}
.pick button{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:16px;background:#fff;border:2px solid var(--line);font-weight:500;font-size:15px}
.pick button i{width:14px;height:14px;border-radius:50%}
.pick button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.ccols{display:grid;gap:16px}
.ccol{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ccol .hd{padding:20px 22px;background:var(--c);color:#fff}
.ccol .hd .vm{font-size:56px}
.ccol .bd{padding:18px 22px 22px}
.ccol .bd .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);margin:16px 0 8px;font-weight:500}

/* tech page */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px}
.tcard .big{font-size:40px;font-weight:600;color:#004FCE;letter-spacing:-.02em}
.tcard b{display:block;font-size:17px;margin:6px 0}
.tcard span{color:var(--gray);font-size:14.5px;font-weight:300;line-height:1.5}
.sec-t{font-size:26px;font-weight:600;margin:36px 0 6px;letter-spacing:-.01em}
.sec-s{color:var(--gray);font-weight:300;margin:0 0 18px;font-size:16px}
.mat{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mat .m{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:center}
.mat .m .lens{margin:0 auto 12px;height:70px;display:flex;align-items:center;justify-content:center}
.mat .m b{display:block;font-size:18px}
.mat .m span{font-size:12.5px;color:var(--gray);font-weight:300}
.photo{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.photo .p{flex:1;min-width:110px;border-radius:16px;padding:14px;color:#fff;font-weight:500;font-size:14px;min-height:80px;display:flex;align-items:flex-end}

.isoleg{margin-top:14px}.isoleg .bar{height:12px;border-radius:99px;background:linear-gradient(90deg,#00008F 0%,#0000FF 12.5%,#00FFFF 37.5%,#FFFF00 62.5%,#FF0000 87.5%,#800000 100%);border:1px solid var(--line)}
.isoleg .ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gray);margin-top:5px}
.isoleg .cap{font-size:12px;color:#97A1B6;margin-top:6px;font-weight:300}
.card .mini canvas{width:118px!important;flex:none}
.wt{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:14px}.wt th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);font-weight:500;text-align:right;padding:6px 0}.wt th:first-child,.wt td:first-child{text-align:left}.wt td{padding:10px 0;border-top:1px solid var(--line);text-align:right}.wt td.v{color:var(--c);font-weight:600}.wt td.g{color:#22A060;font-weight:600}
.cta{margin-top:28px;background:#fff;color:#0C3982;font-weight:600;padding:14px 22px;border-radius:16px;font-size:16px;position:relative;z-index:1}
.ch-h1{font-size:46px;font-weight:700;letter-spacing:-.025em;line-height:1.05;margin:30px 0 8px;color:#0B1E4A}.ch-h1 em{font-style:normal;color:#1E63E0;display:block}
.ch-sub{font-size:17px;color:var(--gray);font-weight:400;margin:0 0 26px;max-width:520px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:stretch}.steps>div{display:flex}.steps .step{flex:1}
.step{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.step .sh{display:flex;align-items:center;gap:14px;padding:18px 22px}
.step .sh b{font-size:40px;font-weight:700;line-height:1}.step .sh span{font-size:24px;font-weight:600}
.step .sb{padding:20px 22px 24px}
.step .lensbox{max-width:270px;margin:0 auto}
.step .nm{text-align:center;margin-top:12px}.step .nm .vm{font-size:42px;color:var(--c)}
.step .tg{display:block;text-align:center;color:#1E63E0;font-weight:600;font-size:14px;margin-top:6px}
.step .ab{display:block;text-align:center;font-size:13px;color:var(--gray);margin-top:4px}
.step .ab b{color:#14213D}
.step .ds{font-weight:600;font-size:16px;margin:20px 0 12px;line-height:1.4}
.step ul{list-style:none;padding:0;margin:0}.step li{display:flex;gap:10px;font-size:14.5px;color:#3A4560;margin:9px 0}
.step li svg{width:18px;flex:none;stroke:#1E63E0}
.convstrip{display:flex;align-items:center;gap:18px;background:#fff;border:1px dashed #C7D0E0;border-radius:18px;padding:12px 18px;margin-top:16px}
.convstrip .lensbox{width:120px}
.fitgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;margin-top:40px}
.qq{display:grid;gap:10px}
.qq button{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;font-size:16px;font-weight:500}
.qq button .ar{margin-left:auto;color:#97A1B6}
.qq button .pill{min-width:150px;border-radius:12px;padding:7px 12px;font-size:15px;font-weight:600;color:#fff}
.qq button .pill small{display:block;font-size:10px;letter-spacing:.1em;opacity:.85;font-weight:600}
.qq button.on{border-color:#0B1E4A;box-shadow:0 0 0 2px #0B1E4A inset}
.why{background:#0B1E4A;color:#fff;border-radius:26px;padding:30px 30px 26px;position:sticky;top:84px}
.why h3{font-size:28px;margin:0 0 20px;font-weight:600}
.why .it{display:flex;gap:16px;margin:0 0 18px}.why .it b{font-size:26px;color:#7FA8F5;font-weight:600;min-width:38px}
.why .it strong{display:block;font-size:17px;font-weight:600}.why .it span{font-size:14px;color:#C2CCE3;font-weight:300}
.rec{border-radius:22px;overflow:hidden;background:#fff;border:1px solid var(--line);margin-bottom:16px}
.rec .rh{background:var(--c);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:18px}
.rec .rh .vm{font-size:50px}.rec .rb{padding:16px 22px 20px;font-size:15px;color:#3A4560;line-height:1.5}
@media (max-width:980px){.steps,.fitgrid{grid-template-columns:1fr}.ch-h1{font-size:36px}}
.hw-hero{margin:26px 0 0;border-radius:30px;padding:44px 48px;color:#fff;background:radial-gradient(circle at 85% 30%,rgba(0,170,255,.35),transparent 50%),linear-gradient(120deg,#061636,#0C3982 60%,#0A6FB8);position:relative;overflow:hidden}
.hw-hero h1{font-size:44px;margin:0 0 10px;font-weight:600;letter-spacing:-.02em}.hw-hero p{font-size:18px;font-weight:300;max-width:640px;margin:0;opacity:.9;line-height:1.5}
.hw-idx{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.hw-idx button{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:10px 16px;font-size:14px}
.hw{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px;margin-top:20px}
.hw .num{font-size:13px;letter-spacing:.14em;color:#1E63E0;font-weight:600}
.hw h2{font-size:30px;margin:6px 0 10px;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.hw p.t{color:#3A4560;font-size:16px;line-height:1.6;font-weight:300;margin:0 0 14px}
.pc{list-style:none;padding:0;margin:12px 0 0}.pc li{display:flex;gap:10px;align-items:center;margin:9px 0;font-size:15px}
.pc i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;font-style:normal;font-size:13px;font-weight:700}
.pc i.ok{background:#22B07D}.pc i.no{background:#E5484D}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:5px;gap:4px;margin:6px 0 14px}
.seg button{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:var(--gray)}.seg button.on{background:#0B1E4A;color:#fff}
.kv{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.kv div{flex:1;min-width:120px;background:var(--bg);border-radius:14px;padding:12px 14px}.kv b{display:block;font-size:22px;color:#0B1E4A}.kv span{font-size:12.5px;color:var(--gray)}
.params{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.params div{background:var(--bg);border-radius:16px;padding:14px;font-size:14px;font-weight:500;display:flex;gap:10px;align-items:center}
.params svg{width:22px;stroke:#1E63E0;flex:none}
.labelbox{font-family:ui-monospace,Menlo,monospace;background:#0B1E4A;color:#DCE6FA;border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.9;margin-top:12px}
.labelbox b{color:#7FD0FF;font-weight:600}
.big63{display:flex;align-items:baseline;gap:14px;margin-top:6px}.big63 b{font-size:64px;color:#1E63E0;letter-spacing:-.03em;line-height:1}
.ffsteps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}.ffsteps div{background:var(--bg);border-radius:16px;padding:14px;font-size:13.5px;color:#3A4560}.ffsteps b{display:block;color:#1E63E0;font-size:20px;margin-bottom:4px}
@media (max-width:980px){.hw{grid-template-columns:1fr}.params{grid-template-columns:1fr 1fr}.ffsteps{grid-template-columns:1fr 1fr}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:980px){
  .fov,.two{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr 1fr}
  .mat{grid-template-columns:repeat(3,1fr)}
  .lhero .vm{font-size:80px}
  .hero h1{font-size:34px}
  .nav button span{display:none}
  .nav button{padding:12px 16px}
}
@media (max-width:600px){
  .side2{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
  .wrap,.panel{padding-left:16px;padding-right:16px}
  .hero{padding:30px 24px}
  .fov>*,.two>*,.hw>*,.cmphead>*{min-width:0;max-width:100%}
  .fov .box,.two .box{padding:16px}
  .seg,.toggle{flex-wrap:wrap;max-width:100%}.toggle button{white-space:normal}
  .ccols{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .ccol .hd .vm{font-size:44px}
  .hw{padding:20px}.hw-hero{padding:30px 24px}.hw-hero h1{font-size:32px}
  .ffsteps,.params{grid-template-columns:1fr 1fr}
  .lhero .vm{font-size:64px}

}
</style>
</head>

/* ===================== MAPA DE ISOCILINDRO =====================
 Mapa técnico de astigmatismo residual (D) numa lente Ø 60 mm, adição 2,00.
 Modelo ilustrativo derivado da largura de campo de cada desenho. */
const MAPS=[]; const KMM=60/350;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function halfW(y,f,c,n){
 if(y>=6)return f; if(y>=-2)return lerp(c,f,sstep((y+2)/8));
 if(y>=-10)return c; if(y>=-17)return lerp(n,c,sstep((y+17)/7)); return n;
}
function cylAt(sim,x,y){
 if(sim.type==="sv"||sim.type==="rx"){
  const R0=sim.w*KMM/2*.82, r=Math.hypot(x,y*1.08);
  let v=r<=R0?0:sim.peak*Math.min(1.7,Math.pow((r-R0)/sim.spread,1.3));
  if(sim.type==="rx"&&y<-8)v+=.3*sstep((Math.abs(x)-13)/9)*sstep((-8-y)/8);
  return v;
 }
 let f,c,n;
 if(sim.type==="oc"){f=sim.cw*KMM*.32/2;c=sim.cw*KMM/2*.62;n=sim.nw*KMM/2*.7;}
 else{f=sim.fw*KMM/2;c=sim.cw*KMM/2*.55;n=sim.nw*KMM/2*.8;}
 if(sim.cl){y=y<0?y*16/sim.cl:y;}
 if(sim.tilt){x=x-sim.tilt*.12;}
 const w=halfW(y,f,c,n), d=Math.abs(x)-w;
 const g=.22+.78*Math.exp(-Math.pow((y+10)/13,2));
 const t=d/sim.spread, bump=d<=0?0:Math.min(1,t*Math.exp(1-t)*1.0+ .18*sstep(t/3));
 let v=sim.peak*g*bump*(sim.cl?Math.pow(16/sim.cl,.6):1);
 if(sim.tilt)v+=sim.tilt*.035*sstep((Math.abs(x)-6)/18)+sim.tilt*.02*sstep((y-4)/14);
 if(sim.type==="oc"&&y>7)v=Math.max(v,1.4*sstep((y-7)/20));
 return v;
}
function widthAt(sim,y){ // largura (mm) com astigmatismo < 0,50 D
 if(sim.type==="oc"&&y>4)return 0;
 for(let x=0;x<=26;x+=.25){if(cylAt(sim,x,y)>=.5)return Math.round(x*2);} return 52;
}
function zoneStats(sim){return [widthAt(sim,10),widthAt(sim,-5),widthAt(sim,-17)];}
const STOPS=[[0,[236,244,255]],[.5,[120,196,236]],[1,[88,196,124]],[1.5,[244,214,64]],[2,[242,140,44]],[2.6,[214,48,42]]];
function cmap(v){const t=clamp(v/2.5,0,1),f=z=>255*clamp(1.5-Math.abs(4*t-z),0,1);return [f(3),f(2),f(1)];}
function mapSVG(sim,color,opt={}){const id="m"+(++uid);MAPS.push([id,sim,opt]);return `<canvas id="${id}" class="iso" style="width:100%;aspect-ratio:400/320;display:block"></canvas>`;}
function drawMaps(){
 while(MAPS.length){const [id,sim,opt]=MAPS.shift();const cv=document.getElementById(id);if(!cv)continue;paintMap(cv,sim,opt);}
}
function paintMap(cv,sim,opt={}){
 const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round((cv.clientWidth||300)*dpr),H=Math.round(W*320/400);
 cv.width=W;cv.height=H;const ctx=cv.getContext("2d"),sc=W/400,k=52/358;
 const off=document.createElement("canvas");off.width=W;off.height=H;const oc=off.getContext("2d"),img=oc.createImageData(W,H),d=img.data;
 const V=new Float32Array(W*H);
 for(let py=0;py<H;py++)for(let px=0;px<W;px++)V[py*W+px]=cylAt(sim,(px/sc-200)*k,-(py/sc-160)*k-2);
 const step=.25;
 for(let py=0;py<H;py++)for(let px=0;px<W;px++){const q=py*W+px,i=q*4,v=V[q];let c=cmap(v);
  if(!opt.mini){const bb=Math.floor(v/step),r=px<W-1?V[q+1]:v,u=py<H-1?V[q+W]:v;
   if(Math.floor(r/step)!==bb||Math.floor(u/step)!==bb)c=c.map(z=>z*.45);}
  d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255;}
 oc.putImageData(img,0,0);
 const P=new Path2D(LENS_PATH);
 ctx.save();ctx.scale(sc,sc);ctx.shadowColor="rgba(11,30,74,.25)";ctx.shadowBlur=14;ctx.shadowOffsetY=5;ctx.fillStyle="#00008F";ctx.fill(P);ctx.restore();
 ctx.save();ctx.scale(sc,sc);ctx.clip(P);ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(off,0,0);
 // brilho de lente
 const gl=ctx.createLinearGradient(0,0,W*.6,H*.6);gl.addColorStop(0,"rgba(255,255,255,.22)");gl.addColorStop(.45,"rgba(255,255,255,0)");ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);ctx.restore();
 ctx.save();ctx.scale(sc,sc);ctx.lineWidth=opt.mini?7:4;ctx.strokeStyle="#14213D";ctx.stroke(P);ctx.restore();
 if(opt.mini)return;
 const U=(u)=>u*sc, yv=ymm=>160-(ymm+2)/k;
 ctx.strokeStyle="#fff";ctx.lineWidth=2*dpr;
 const fy=U(yv(4));ctx.beginPath();ctx.moveTo(U(200)-9*dpr,fy);ctx.lineTo(U(200)+9*dpr,fy);ctx.moveTo(U(200),fy-9*dpr);ctx.lineTo(U(200),fy+9*dpr);ctx.stroke();

function aberr(sim){if(_ab.has(sim))return _ab.get(sim);let tot=0,ab=0;const k=52/358;

  tot++;if(cylAt(sim,(px-200)*k,-(py-160)*k-2)>=1)ab++;}

const FOLD=[];
function drawFolder(){
 while(FOLD.length){const[id,sim]=FOLD.shift();const cv=document.getElementById(id);if(!cv)continue;
  const dpr=Math.min(2,window.devicePixelRatio||1),W=Math.round((cv.clientWidth||300)*dpr),H=Math.round(W*320/400);cv.width=W;cv.height=H;
  const ctx=cv.getContext("2d"),sc=W/400,k=52/358;
  ctx.save();ctx.scale(sc,sc);const P=new Path2D(LENS_PATH);ctx.clip(P);
  const gr=ctx.createRadialGradient(205,175,10,200,160,260);gr.addColorStop(0,"#FFFFFF");gr.addColorStop(.55,"#E4F0FA");gr.addColorStop(1,"#B5D3EE");ctx.fillStyle=gr;ctx.fillRect(0,0,400,320);ctx.restore();
  const img=ctx.getImageData(0,0,W,H),d=img.data;
  const bands=[[.7,[150,205,236],.75],[1.15,[86,172,222],.85],[1.6,[18,140,208],.92],[2.05,[0,118,190],.95]];
  for(let py=0;py<H;py++)for(let px=0;px<W;px++){const i=(py*W+px)*4;if(d[i+3]===0)continue;
   const x=(px/sc-200)*k,y=-(py/sc-160)*k-2,v=cylAt(sim,x,y);
   for(const[th,c,al] of bands){const a=clamp((v-th)/.06,0,1)*al;if(a>0){d[i]=d[i]*(1-a)+c[0]*a;d[i+1]=d[i+1]*(1-a)+c[1]*a;d[i+2]=d[i+2]*(1-a)+c[2]*a;}}}
  ctx.putImageData(img,0,0);
  ctx.save();ctx.scale(sc,sc);ctx.lineWidth=1.5;ctx.strokeStyle="rgba(95,140,190,.55)";ctx.stroke(new Path2D(LENS_PATH));
  ctx.strokeStyle="rgba(20,33,61,.45)";ctx.lineWidth=1.4;const fy=160-6/k*0;ctx.beginPath();ctx.moveTo(192,118);ctx.lineTo(208,118);ctx.moveTo(200,110);ctx.lineTo(200,126);ctx.stroke();ctx.restore();}
}

function radarSVG(cur){
 const ls=["lightid","top","pro"].map(L), N=5, R=110, cx=170, cy=150;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
 let g="";[25,50,75,100].forEach(v=>{g+=`<polygon points="${[...Array(N)].map((_,i)=>pt(i,v).join(",")).join(" ")}" fill="none" stroke="#E3E8F2"/>`;});
 for(let i=0;i<N;i++){const[x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E3E8F2"/>`;
  const[lx,ly]=pt(i,128);g+=`<text x="${lx}" y="${ly}" font-size="10.5" text-anchor="middle" dominant-baseline="middle" fill="#5F6B85" font-family="Lexend, Arial">${["Customização","Transição","Adaptação","Conforto","Estabilidade"][i]}</text>`;}
 ls.forEach(l=>{const on=l.id===cur;g+=`<polygon points="${l.bars.map((v,i)=>pt(i,v).join(",")).join(" ")}" fill="${l.color}" fill-opacity="${on?.28:.04}" stroke="${l.color}" stroke-width="${on?3:1.5}" ${on?"":'stroke-dasharray="4 4"'}/>`;});
 return `<svg viewBox="0 0 340 300" style="width:100%;max-height:300px">${g}</svg>

}

  <div style="flex:1;min-width:260px"><h3>Fale com a Multivision Lab</h3><p class="sub" style="margin:6px 0 0">WhatsApp (81) 98235-0060 · @multivisionlab_ · multivisionlab.com.br</p></div>
  <img src="${IMG_LOGO}" alt="Multivision Lab" style="height:46px">
 </div>
 </div>`;
}

/* ===================== SIMULADOR DE ESPESSURA ===================== */
state.grau=-4; state.sun=60;
const IDX=[["CR-39",1.50,"#9AA5BA"],["Poli 1.59",1.59,"#5779BA"],["1.67",1.67,"#004FCE"],["1.74",1.74,"#0C3982"]];
function thick(P,n){ // lente Ø 60 mm (semi 30), valores aproximados
 const h=30, sag=Math.abs(P)*h*h/(2000*(n-1));
 if(P<=0){const ct=n<1.55?2.0:1.5; return {ct, et:ct+sag};}
 const et=1.0; return {ct:et+sag, et};
}
function thkRows(){
 const P=state.grau, sc=7, W=260;
 return IDX.map(([nm,n,col])=>{
  const t=thick(P,n), ct=t.ct*sc, et=t.et*sc, cx=W/2, top=10;
  // corte transversal: frente levemente curva, trás conforme espessuras
  const path=`M10,${top+6} Q${cx},${top-4} ${W-10},${top+6} L${W-10},${top+6+et} Q${cx},${top+6+ (2*ct-et)} 10,${top+6+et} Z`;
  return `<div style="display:grid;grid-template-columns:110px 1fr 150px;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)">
   <b style="font-size:16px">${nm}</b>
   <svg viewBox="0 0 ${W} ${Math.max(70,et+30,ct+30)}" style="width:100%;height:64px"><path d="${path}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2"/></svg>
   <div style="font-size:14px;color:var(--gray);font-weight:300">Borda <b style="color:var(--ink)">${t.et.toFixed(1)} mm</b><br>Centro <b style="color:var(--ink)">${t.ct.toFixed(1)} mm</b></div></div>`;}).join("");
}
const fmtD=P=>`${P>0?"+":""}${P.toFixed(2).replace(".",",")} D`;
function thicknessBox(){
 const P=state.grau;
 return `<div class="cmphead"><div><h3>Simulador de espessura</h3><p class="sub" style="margin:0">Arraste para o grau do cliente e compare os materiais.</p></div>
  <div id="thkv" style="font-size:34px;font-weight:600;color:#004FCE">${fmtD(P)}</div></div>
  <input type="range" min="-10" max="6" step="0.25" value="${P}" oninput="state.grau=+this.value;document.getElementById('thkr').innerHTML=thkRows();document.getElementById('thkv').textContent=fmtD(state.grau)" style="width:100%;accent-color:#004FCE;height:36px">
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:6px"><span>−10,00 (miopia)</span><span>0</span><span>+6,00 (hipermetropia)</span></div>
  <div id="thkr">${thkRows()}</div><p class="note">Valores aproximados para lente de Ø 60 mm, apenas para demonstração. A espessura final depende da armação, da DNP e do desenho.</p>`;
}
function photoBox(){
 const s=state.sun;
 return `<div class="cmphead"><div><h3>Fotossensível na prática</h3><p class="sub" style="margin:0">Arraste do ambiente interno para o sol forte.</p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${[["Cinza","#3A3F47"],["Marrom","#5A3A22"],["Verde-grafite","#2E3D35"],["Safira","#1F3A70"]].map(([n,c],i)=>`<button class="chip ${state.ph===i||(!state.ph&&i===0)?'on':''}" onclick="state.ph=${i};document.querySelector('#ph').innerHTML=photoBox()">${n}</button>`).join("")}</div></div>
  <div id="phs">${phScenes()}</div>
  <input type="range" min="0" max="100" value="${s}" oninput="state.sun=+this.value;document.getElementById('phs').innerHTML=phScenes()" style="width:100%;accent-color:#F59B2E;height:36px;margin-top:10px">
  <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray)"><span>Ambiente interno</span><span>Nublado</span><span>Sol forte</span></div>`;
}
function phScenes(){
 const s=state.sun, k=++uid, tint=s/100*0.78;
 return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px">
  ${[0,1].map(j=>{const col=[["#3A3F47"],["#5A3A22"],["#2E3D35"],["#1F3A70"]][state.ph||0][0]; return `<div><p class="lbl" style="font-size:14px;font-weight:600;margin:0 0 8px">${j===0?"Lente incolor":"Lente fotossensível"}</p>
   <svg viewBox="0 0 400 320" style="width:100%"><defs><clipPath id="pc${k}${j}"><path d="${LENS_PATH}"/></clipPath></defs>
   <g clip-path="url(#pc${k}${j})">${scene()}<rect width="400" height="320" fill="#FFF8D8" opacity="${s/100*0.55}"/>
   ${j===1?`<rect width="400" height="320" fill="${col}" opacity="${tint}"/>`:""}</g>
   <path d="${LENS_PATH}" fill="none" stroke="#1B2540" stroke-width="5"/></svg></div>`}).join("")}
  </div>`;
}

/* swipe entre lentes */
let sx=null;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
let sy=null;
document.addEventListener("touchend",e=>{
 if(sx===null)return; const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; sx=null;
 const h=location.hash.slice(1); if(!h.startsWith("lente-")||Math.abs(dx)<90||Math.abs(dy)>60)return;
 if(e.target.closest(".mk,.tabs"))return;
 const i=LENSES.findIndex(l=>l.id===h.slice(6)); const n=LENSES[(i+(dx<0?1:-1)+LENSES.length)%LENSES.length]; go("lente-"+n.id);
},{passive:true});

render();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
